# Low-data run: the same 100 ARCADE images, initialized from the synthetic model.
name = "unet_synth_finetune_n100"
seed = 42

[data]
source = "arcade"
crop = 256
augment = true
n_train = 100

[model]
base = 16
depth = 4

[train]
epochs = 100
batch_size = 8
lr = 0.001
weight_decay = 0.0001
warmup_steps = 100
val_every = 10
max_minutes = 7
init_from = "checkpoints/unet_synth_only/best.pt"

[loss]
bce_weight = 1.0
dice_weight = 1.0
