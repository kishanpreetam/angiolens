# U-Net trained only on synthetic phantoms. Its best checkpoint is evaluated
# as the "synthetic only" model and used to initialize the fine-tuning runs.
name = "unet_synth_only"
seed = 42

[data]
source = "synth"
crop = 256
augment = true

[model]
base = 16
depth = 4

[train]
epochs = 8
batch_size = 8
lr = 0.001
weight_decay = 0.0001
warmup_steps = 100
val_every = 1
max_minutes = 6
